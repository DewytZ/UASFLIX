<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>UASFLIX</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ======================================== -->
    <!-- HEADER -->
    <!-- ======================================== -->

    <header>

        <!-- LOGO -->
        <div class="logo-container">

            <img
                src="img/logouas.png"
                alt="Logo UAS"
                class="logo-uas"
            >

            <div class="logo">
                UASFLIX
            </div>

        </div>

        <!-- NAV -->
        <div class="top-nav">

            <!-- INICIO -->
            <button onclick="showAll()">
                Inicio
            </button>

            <!-- GÉNEROS -->
            <select
                id="tagFilter"
                onchange="filterByTag()"
            >

                <option value="">
                    Géneros
                </option>

                <option value="accion">
                    Acción
                </option>

                <option value="suspenso">
                    Suspenso
                </option>

                <option value="drama">
                    Drama
                </option>

                <option value="comedia">
                    Comedia
                </option>

            </select>

            <!-- FACULTADES -->
            <select
                id="facultyFilter"
                onchange="filterFaculty(this.value)"
            >

                <option value="">
                    Facultades
                </option>

                <option value="informatica">
                    💻 Informática
                </option>

                <option value="ingenieria">
                    🛠 Ingeniería
                </option>

                <option value="medicina">
                    🩺 Medicina
                </option>

                <option value="derecho">
                    ⚖ Derecho
                </option>

                <option value="arquitectura">
                    🏛 Arquitectura
                </option>

            </select>

        </div>

        <!-- DERECHA -->
        <div class="header-right">

            <!-- BUSCADOR -->
            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar por título"
                >

                <button onclick="searchMovie()">
                    🔍
                </button>

            </div>

            <!-- PERFIL -->
            <div
                class="profile-circle"
                onclick="toggleSidebar()"
            >

                <img
                    src="img/perfil.png"
                    alt="Perfil"
                >

            </div>

        </div>

    </header>

    <!-- ======================================== -->
    <!-- GRID PELÍCULAS -->
    <!-- ======================================== -->

    <div
        class="movies-grid"
        id="movies"
    ></div>

    <!-- ======================================== -->
    <!-- SIDEBAR -->
    <!-- ======================================== -->

    <div
        id="sidebar"
        class="sidebar"
     >

        <h2 onclick="toggleSidebar()">
        Menú
        </h2>

        <button onclick="showAll()">
            🏠 Inicio
        </button>

        <button onclick="goProfile()">
            👤 Perfil
        </button>

        <button
            class="theme-btn"
            id="btnTema"
        >

            🌙 Cambiar tema

        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >

            ⛔ Cerrar sesión

        </button>

    </div>

    <!-- ======================================== -->
    <!-- SCRIPT -->
    <!-- ======================================== -->

    <script src="js/main.js"></script>

</body>
</html>
