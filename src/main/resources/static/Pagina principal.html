<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UASFLIX</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
       <div class="logo">UASFLIX</div>

    <!-- BOTÓN MENÚ (SE QUEDA AQUÍ) -->
    <div class="menu-btn">Menú</div>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <h2>Menú</h2>

        <button onclick="showAll()">🏠 Inicio</button>
        <button onclick="goProfile()">👤 Perfil</button>

        <!-- BOTÓN BÚSQUEDA -->
        <button id="btnBusqueda">🔍 Búsqueda</button>

        <!-- SUBMENÚ -->
        <div id="searchMenu" class="search-menu">
            <!-- Facultades -->
            <p><b>Facultades</b></p>
            <button onclick="filterFaculty('informatica')">💻 Informática</button>
            <button onclick="filterFaculty('ingenieria')">🛠 Ingeniería</button>
            <button onclick="filterFaculty('medicina')">🩺 Medicina</button>
            <button onclick="filterFaculty('derecho')">⚖ Derecho</button>
            <button onclick="filterFaculty('arquitectura')">🏛 Arquitectura</button>
            <button onclick="showAll()">🌐 Todas</button>

            <!-- Buscar por nombre -->
            <p><b>Búsqueda</b></p>
            <input type="text" id="searchInput" placeholder="Buscar película">
            <button onclick="searchMovie()">Buscar</button>

            <!-- Etiquetas -->
            <p><b>Etiquetas</b></p>
            <select id="tagFilter" onchange="filterByTag()">
                <option value="">Seleccionar</option>
                <option value="accion">Acción</option>
                <option value="Suspenso">Suspenso</option>
                <option value="Drama">Drama</option>
                <option value="comedia">Comedia</option>
            </select>
        </div>

        <!-- 🔥 BOTÓN TEMA (DENTRO DEL SIDEBAR) -->
        <button class="theme-btn" id="btnTema">🌙 Cambiar tema</button>
    </div>
</header>

    

    <div class="alphabet"></div>

    <div class="movies-grid" id="movies">
        </div>

    <script src="js/main.js"></script>

</body>
</html>
